---
- name: Set up Flask Backend
  hosts: web
  become: yes

  tasks:
    - name: Install Python3, pip, and dependencies
      apt:
        name:
          - python3
          - python3-pip
        state: present

    - name: Install gunicorn
      pip:
        name: gunicorn

    - name: Clone Flask repo
      git:
        repo: "git@github.com:your-repo/backend.git"
        dest: /home/your_user/flask-backend

    - name: Install Flask dependencies
      pip:
        requirements: /home/your_user/flask-backend/requirements.txt

    - name: Start Flask app with gunicorn
      systemd:
        name: flask-backend
        state: started
        enabled: yes
        exec_start: /usr/local/bin/gunicorn -b 0.0.0.0:5000 app:app
